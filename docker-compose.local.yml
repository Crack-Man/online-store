services:
    nginx:
        build:
            context: ./docker/nginx/
        environment:
            API_DOMAIN: '${API_DOMAIN:-localhost}'
            API_PORT: '${API_PORT:-8080}'
            ENABLE_SSL: '${ENABLE_SSL:-false}'
        ports:
            - '8080:8080'
            - '80:80'
        volumes:
            - ./api:/srv/api:ro
            - ./docker/nginx/logs:/var/log/nginx
        depends_on:
            - php
        networks:
            - backend

    php:
        build:
            context: ./docker/php/
            args:
                WWW_UID: '${WWW_UID:-1000}'
                WWW_GID: '${WWW_GID:-1000}'
        environment:
            WWW_UID: '${WWW_UID:-1000}'
            WWW_GID: '${WWW_GID:-1000}'
        restart: always
        volumes:
            - ./api:/srv/api
            - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
        depends_on:
            - pgsql
        networks:
            - backend

    queue:
        build:
            context: ./docker/php/
            args:
                WWW_UID: '${WWW_UID:-1000}'
                WWW_GID: '${WWW_GID:-1000}'
        environment:
            WWW_UID: '${WWW_UID:-1000}'
            WWW_GID: '${WWW_GID:-1000}'
        restart: always
        command: /usr/bin/supervisord -n -c /etc/supervisord.conf
        volumes:
            - ./api:/srv/api
            - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
            - ./docker/php/queue/supervisord.d:/etc/supervisord.d
            - ./docker/php/queue/logs:/var/log/worker
        depends_on:
            - pgsql
            - redis
        networks:
            - backend

    pgsql:
        image: 'postgres:17'
        ports:
            - '5432:5432'
        restart: always
        environment:
            PGPASSWORD: '${DB_PASSWORD}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - ./docker/pgsql/dumps:/srv/dumps
            - ./docker/pgsql/data:/var/lib/postgresql/data:rw
        networks:
            - backend

    redis:
        image: 'redis:8.6.0-alpine'
        expose:
            - '6379'
        restart: always
        volumes:
            - ./docker/redis/data:/data
        networks:
            - backend

networks:
    backend:
        driver: bridge