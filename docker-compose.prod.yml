services:
    nginx:
        build:
            context: ./docker/nginx/
        environment:
            API_DOMAIN: '${API_DOMAIN}'
            API_PORT: '${API_PORT:-8443}'
            ENABLE_SSL: '${ENABLE_SSL:-true}'
            SSL_CERT: '${SSL_CERT}'
            SSL_KEY: '${SSL_KEY}'
        ports:
            - '8443:8443/tcp'
            - '8443:8443/udp'
            - '443:443/tcp'
            - '443:443/udp'
            - '80:80'
        volumes:
            - ./api:/srv/api:ro
            - ./docker/nginx/logs:/var/log/nginx
            # Let's Encrypt сертификаты с хоста (read-only)
            - /etc/letsencrypt:/etc/letsencrypt:ro
        depends_on:
            - php
        restart: always
        networks:
            - backend

    php:
        build:
            context: ./docker/php/
            args:
                WWW_UID: '${WWW_UID:-33}'
                WWW_GID: '${WWW_GID:-33}'
        environment:
            WWW_UID: '${WWW_UID:-33}'
            WWW_GID: '${WWW_GID:-33}'
        restart: always
        volumes:
            - ./api:/srv/api
            - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
        depends_on:
            - pgsql
        networks:
            - backend

    queue:
        build:
            context: ./docker/php/
            args:
                WWW_UID: '${WWW_UID:-33}'
                WWW_GID: '${WWW_GID:-33}'
        environment:
            WWW_UID: '${WWW_UID:-33}'
            WWW_GID: '${WWW_GID:-33}'
        restart: always
        command: /usr/bin/supervisord -n -c /etc/supervisord.conf
        volumes:
            - ./api:/srv/api
            - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
            - ./docker/php/queue/supervisord.d:/etc/supervisord.d
            - ./docker/php/queue/logs:/var/log/worker
        depends_on:
            - pgsql
            - redis
        networks:
            - backend

    pgsql:
        image: 'postgres:17'
        restart: always
        environment:
            PGPASSWORD: '${DB_PASSWORD}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - ./docker/db/dumps:/srv/dumps
            - ./docker/db/data:/var/lib/postgresql/data:rw
        networks:
            - backend

    redis:
        image: 'redis:8.6.0-alpine'
        expose:
            - '6379'
        restart: always
        volumes:
            - ./docker/redis/data:/data
        networks:
            - backend

    certbot:
        image: certbot/certbot
        restart: always
        entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"]
        volumes:
            - ./docker/certbot/conf:/etc/letsencrypt
            - ./docker/certbot/www:/srv/certbot
        networks:
            - backend

networks:
    backend:
        driver: bridge
